<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Key 管理台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">AStudio Console</p>
        <h1>登录后管理你的 API Key</h1>
        <p class="hero-copy">
          一个最小可运行的示例：登录、查看、创建、删除 API Key。
        </p>
      </section>

      <section class="panel" id="login-panel">
        <div class="panel-head">
          <h2>登录入口</h2>
          <p>默认账号：admin / admin123</p>
        </div>
        <form id="login-form" class="form">
          <label>
            <span>用户名</span>
            <input name="username" type="text" value="admin" required />
          </label>
          <label>
            <span>密码</span>
            <input name="password" type="password" value="admin123" required />
          </label>
          <button type="submit">登录</button>
        </form>
      </section>

      <section class="panel hidden" id="app-panel">
        <div class="panel-head">
          <div>
            <h2>API Key 管理</h2>
            <p id="welcome-text"></p>
          </div>
          <button id="logout-btn" class="button-secondary" type="button">退出登录</button>
        </div>

        <form id="create-key-form" class="form inline-form">
          <label>
            <span>Key 名称</span>
            <input name="name" type="text" placeholder="例如 Production" required />
          </label>
          <label>
            <span>Key 值</span>
            <input name="value" type="text" placeholder="sk-xxxx" required />
          </label>
          <button type="submit">新增 Key</button>
        </form>

        <div id="empty-state" class="empty hidden">暂无 API Key，请先创建。</div>
        <div id="key-list" class="key-list"></div>
      </section>

      <p id="message" class="message" aria-live="polite"></p>
    </main>

    <script src="/app.js"></script>
  </body>
  </html>
